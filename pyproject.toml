[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "iachat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pypdf>=5,<7", "reportlab>=4,<5", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "PyJWT[crypto]>=2.9,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<9"]
[tool.pytest.ini_options]
testpaths = ["tests"]
