name: Migrar proveedores a Oracle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
      - name: Preparar SSH y comprobar acceso
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          bash scripts/oracle_ssh_preflight.sh --connect
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ORACLE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 -t ed25519 "$ORACLE_HOST" 2>/dev/null > "$HOME/.ssh/known_hosts"
          actual="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" -E sha256 | awk '{print $2}' | head -1)"
          test "$actual" = "SHA256:UDVMx6HCL8d412N+TaY4O0Ob1rGVTWI6vKmz0Dm3yyY"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Fusionar claves de proveedores en la VM y reiniciar Router
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: |
          set -euo pipefail
          providers_file="$RUNNER_TEMP/router-providers.env"
          umask 077
          python3 - "$providers_file" <<'PY'
          import json, os, pathlib, sys
          names = ("GROQ", "NVIDIA", "OPENROUTER", "MISTRAL", "CEREBRAS", "SAMBANOVA")
          keys = {f"{n}_API_KEY": os.environ[f"{n}_API_KEY"] for n in names if os.environ.get(f"{n}_API_KEY")}
          if not keys:
              sys.stderr.write("Ningún secreto de proveedor está definido en el entorno. No se modificó la VM.\n")
              sys.exit(1)
          pathlib.Path(sys.argv[1]).write_text(
              "".join(f"{k}={json.dumps(v)}\n" for k, v in keys.items()), encoding="utf-8"
          )
          print("Proveedores a cargar: " + ", ".join(k.split("_API_KEY")[0] for k in keys))
          PY
          remote="/tmp/router-providers-$GITHUB_RUN_ID.env"
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          scp $SSH_OPTS "$providers_file" "$ORACLE_USER@$ORACLE_HOST:$remote"
          ssh $SSH_OPTS "$ORACLE_USER@$ORACLE_HOST" "bash -s -- $remote" <<'REMOTE'
          set -Eeuo pipefail
          src="$1"
          [[ "$src" =~ ^/tmp/router-providers-[0-9]+\.env$ ]]
          dir="$HOME/.config/router"
          target="$dir/providers.env"
          install -d -m 700 "$dir"
          umask 077
          base="/dev/null"
          [[ -f "$target" ]] && base="$target"
          tmp="$(mktemp "$dir/.providers.env.XXXXXX")"
          # Fusiona: conserva las claves que ya estaban y reemplaza solo las que llegan ahora.
          awk 'NR==FNR { if (match($0, /^[A-Za-z_][A-Za-z0-9_]*=/)) over[substr($0, 1, RLENGTH - 1)] = 1; next }
               { if (match($0, /^[A-Za-z_][A-Za-z0-9_]*=/)) { k = substr($0, 1, RLENGTH - 1); if (k in over) next } print }' \
            "$src" "$base" > "$tmp"
          cat "$src" >> "$tmp"
          chmod 600 "$tmp"
          updated="$(grep -c '_API_KEY=' "$src" || true)"
          mv -f "$tmp" "$target"
          total="$(grep -c '_API_KEY=' "$target" || true)"
          rm -f "$src"
          sudo -n mkdir -p /etc/systemd/system/router.service.d
          printf '[Service]\nEnvironmentFile=%s\n' "$dir/providers.env" \
            | sudo -n tee /etc/systemd/system/router.service.d/10-providers.conf >/dev/null
          sudo -n systemctl daemon-reload
          sudo -n systemctl restart router.service
          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:8010/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Router no respondió /health tras reiniciar con las claves nuevas."
            exit 1
          fi
          echo "Router activo: $total claves en providers.env ($updated actualizadas en esta corrida)"
          REMOTE
      - name: Limpiar material SSH y claves temporales
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" "$RUNNER_TEMP/router-providers.env"
