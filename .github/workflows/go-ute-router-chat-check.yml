name: G.O. contrato Router sin inferencia
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-latest
    environment: oracle-production
    timeout-minutes: 5
    steps:
      - name: Verificar autenticación y contrato local sin invocar modelos
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          keyfile="$(mktemp ~/.ssh/go-router-key.XXXXXXXX)"
          knownfile="$(mktemp ~/.ssh/go-router-host.XXXXXXXX)"
          trap 'rm -f "$keyfile" "$knownfile"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keyscan -T 10 -t ed25519 "$ORACLE_HOST" 2>/dev/null > "$knownfile"
          test "$(ssh-keygen -lf "$knownfile" -E sha256 | awk '{print $2}' | head -1)" = 'SHA256:JCUGOZrLtlE+FkPv+evyeSAdxDs5iYqLk7hteTpOBHI'
          chmod 600 "$knownfile"
          ssh -i "$keyfile" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$knownfile" "$ORACLE_USER@$ORACLE_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          test "$(systemctl is-active go-ute)" = active
          test "$(systemctl is-active router)" = active
          sudo -n -u go-ute bash -se <<'CHECK'
          set -euo pipefail
          set -a
          . /etc/go-ute/app.env
          set +a
          cd /opt/go-ute
          /opt/go-ute/.venv/bin/python - <<'PY'
          import os
          from go_ute.router import probe_contract
          # Nunca llamar a answer() desde este workflow: podría activar inferencia
          # y facturación de un proveedor todavía no autorizado.
          result = probe_contract()
          print("GO_ROUTER_CONTRACT status=" + str(result["status"])
                + " anonymous_http=" + str(result.get("anonymous_http", "-"))
                + " authorized_http=" + str(result.get("authorized_http", "-")))
          print("GO_ROUTER_GATE " +
                ("enabled" if os.getenv("GO_ROUTER_ENABLED") == "1" else "disabled"))
          if result["status"] != "verified":
              raise SystemExit("ERROR: contrato local G.O. -> Router no verificado")
          print("OK: autenticación y validación HTTP verificadas; 0 inferencias ejecutadas.")
          PY
          CHECK
          REMOTE
