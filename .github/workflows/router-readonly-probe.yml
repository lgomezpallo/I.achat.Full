name: Router — verificar servicio y puerto 8010 (solo lectura)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
      - name: Auditar router.service y 127.0.0.1:8010 sin escribir
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          bash scripts/oracle_ssh_preflight.sh --connect
          test -n "$ORACLE_HOST" && test -n "$ORACLE_USER" && test -n "$ORACLE_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          keyfile="$(mktemp "$HOME/.ssh/router-probe-key.XXXXXXXX")"
          knownfile="$(mktemp "$HOME/.ssh/router-probe-known.XXXXXXXX")"
          trap 'rm -f "$keyfile" "$knownfile"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keyscan -T 10 -t ed25519 "$ORACLE_HOST" 2>/dev/null > "$knownfile"
          test -s "$knownfile"
          actual="$(ssh-keygen -lf "$knownfile" -E sha256 | awk '{print $2}' | head -1)"
          test "$actual" = 'SHA256:UDVMx6HCL8d412N+TaY4O0Ob1rGVTWI6vKmz0Dm3yyY' || {
            echo "::error::La huella SSH no coincide con la VM esperada. No se audita."
            exit 1
          }
          chmod 600 "$knownfile"
          ssh -i "$keyfile" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$knownfile" -o ConnectTimeout=15 "$ORACLE_USER@$ORACLE_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          echo "ROUTER_AUDIT_MODE=read_only"
          echo "ROUTER_AUDIT_HOSTNAME=$(hostname)"
          echo "ROUTER_LOAD=$(systemctl show router -p LoadState --value 2>/dev/null || echo unknown)"
          echo "ROUTER_ACTIVE=$(systemctl is-active router 2>/dev/null || true)"
          echo "ROUTER_SUBSTATE=$(systemctl show router -p SubState --value 2>/dev/null || echo unknown)"
          echo "ROUTER_SINCE=$(systemctl show router -p ActiveEnterTimestamp --value 2>/dev/null || echo unknown)"
          echo "PORT_8010_LISTEN=$(ss -ltnH | awk '$4 ~ /:8010$/ {found=1} END {print found+0}')"
          echo "PORT_8010_BIND=$(ss -ltnH | awk '$4 ~ /:8010$/ {print $4}' | paste -sd, -)"
          echo "PORT_8010_NON_LOOPBACK=$(ss -ltnH | awk '$4 ~ /:8010$/ && $4 !~ /^(127\.0\.0\.1|\[::1\]):8010$/ {found=1} END {print found+0}')"
          echo "ROUTER_HEALTH_HTTP=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8010/health || true)"
          echo "IACHAT_SERVICE_ACTIVE=$(systemctl is-active iachat 2>/dev/null || true)"
          echo "IACHAT_READY_HTTP=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8000/ready || true)"
          echo "IACHAT_READY_MODE=$(curl -fsS --max-time 5 http://127.0.0.1:8000/ready 2>/dev/null | sed -n 's/.*"mode":"\([a-z]*\)".*/\1/p' || true)"
          # Inventario del Router: sólo nombres de claves de proveedor, nunca valores.
          echo "SUDO_NOPASSWD=$(sudo -n true 2>/dev/null && echo yes || echo no)"
          echo "LISTEN_PORTS=$(ss -ltnH | awk '{print $4}' | sort -u | paste -sd, -)"
          echo "PUBLIC_SELF_READY=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -H 'Host: ia-chat.duckdns.org' http://127.0.0.1/ready || true)"
          echo "PUBLIC_SELF_READY_BODY=$(curl -s --max-time 5 -H 'Host: ia-chat.duckdns.org' http://127.0.0.1/ready 2>/dev/null | head -c 200 || true)"
          echo "PROXY_TARGETS=$(sudo -n grep -rhoE 'proxy_pass[[:space:]]+[^;]+' /etc/nginx /etc/caddy 2>/dev/null | sort -u | paste -sd, - || true)"
          ruser=$(systemctl show router -p User --value 2>/dev/null || true)
          ruser=${ruser:-root}
          rhome=$(getent passwd "$ruser" | cut -d: -f6 || true)
          rhome=${rhome:-/root}
          penv="$rhome/.config/router/providers.env"
          if sudo -n test -s "$penv" 2>/dev/null; then
            echo "ROUTER_PROVIDERS_FILE=present"
            echo "ROUTER_PROVIDERS_COUNT=$(sudo -n awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/{n++} END{print n+0}' "$penv")"
            echo "ROUTER_PROVIDERS_KEYS=$(sudo -n awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/{print $1}' "$penv" | sort -u | paste -sd, -)"
          else
            echo "ROUTER_PROVIDERS_FILE=absent_or_unreadable"
            echo "ROUTER_PROVIDERS_COUNT=0"
            echo "ROUTER_PROVIDERS_KEYS="
          fi
          echo "ROUTER_CATALOG_HTTP=$(curl -s -o /tmp/router-catalog.json -w '%{http_code}' --max-time 5 http://127.0.0.1:8010/catalog || true)"
          echo "ROUTER_CATALOG=$(head -c 900 /tmp/router-catalog.json 2>/dev/null | tr '\n\r' '  ' || true)"
          if sudo -n test -s /etc/iachat/router.env 2>/dev/null; then
            echo "IACHAT_ROUTER_ENV=present"
          else
            echo "IACHAT_ROUTER_ENV=absent_or_unreadable"
            echo "ROUTER_AUTH_PROBE=unavailable"
            exit 1
          fi
          # Auth contract only: an invalid body must be rejected before any model
          # runs. The IAchat token is read as root and never printed or passed as
          # an argument, so it cannot leak into the job log or process list.
          sudo -n python3 - <<'PYAUTH'
          import urllib.request
          from pathlib import Path
          from urllib.error import HTTPError

          cfg = {}
          for raw in Path("/etc/iachat/router.env").read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if line.startswith("export "):
                  line = line[7:]
              key, sep, value = line.partition("=")
              if sep:
                  cfg[key.strip()] = value.strip().strip('"').strip("'")
          token = cfg.get("ROUTER_TOKEN", "")
          base = cfg.get("ROUTER_URL", "http://127.0.0.1:8010").rstrip("/")

          def invalid_body_status(bearer=None):
              headers = {"Content-Type": "application/json"}
              if bearer:
                  headers["Authorization"] = "Bearer " + bearer
              request = urllib.request.Request(
                  base + "/route", data=b"{}", headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(request, timeout=5) as response:
                      return response.status
              except HTTPError as error:
                  return error.code
              except Exception:
                  return 0

          anonymous = invalid_body_status()
          authorized = invalid_body_status(token) if token else 0
          print("ROUTER_AUTH_PROBE anonymous_http=" + str(anonymous)
                + " iachat_http=" + str(authorized) + " inferences=0")
          assert anonymous in (401, 403), "Router did not reject an unauthenticated request"
          assert authorized in (400, 422), "IAchat token was not accepted by Router"
          print("ROUTER_AUTH_PROBE=ok_no_inference")
          PYAUTH
          echo "ROUTER_AUDIT_COMPLETE=read_only"
          REMOTE
