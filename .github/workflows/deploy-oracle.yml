name: Desplegar IAchat en Oracle
# Deploy a tested main commit automatically after IAchat CI succeeds.
# Manual dispatch remains available for an authorized retry.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["IAchat CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read  # release-scope reads PR #105 metadata and changed paths
  statuses: write

concurrency:
  group: iachat-oracle-deploy
  cancel-in-progress: false

jobs:
  release-scope:
    # A diagnostic-only merge must not redeploy production after green CI.
    # Any unknown commit scope FAILS this gate rather than risking a deploy.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          deploy = True
          if os.environ["EVENT_NAME"] == "workflow_run":
              repo = os.environ["REPO"]
              sha = os.environ["RELEASE_SHA"]
              if not sha or not os.environ["GH_TOKEN"]:
                  raise SystemExit("release_scope_credentials_or_sha_missing")
              def github_json(url):
                  request = urllib.request.Request(
                      url,
                      headers={
                          "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                          "Accept": "application/vnd.github+json",
                          "User-Agent": "iachat-release-scope",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      return json.load(response)

              # Skip deploy ONLY for the authorized diagnostic PR #105 merge,
              # regardless of squash, merge-commit or rebase strategy.
              pr = github_json(f"https://api.github.com/repos/{repo}/pulls/105")
              if pr.get("merged") and pr.get("merge_commit_sha") == sha:
                  files = github_json(
                      f"https://api.github.com/repos/{repo}/pulls/105/files?per_page=100"
                  )
                  if not isinstance(files, list) or not files or len(files) >= 100:
                      raise SystemExit("diagnostic_pr_scope_incomplete")
                  paths = {item["filename"] for item in files}
                  diagnostic = {
                      ".github/workflows/iachat-one-turn.yml",
                      "scripts/iachat_one_turn_probe.py",
                  }
                  permitted = diagnostic | {".github/workflows/deploy-oracle.yml"}
                  if diagnostic <= paths <= permitted:
                      deploy = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("deploy=" + str(deploy).lower() + "\n")
          print("RELEASE_SCOPE=" + ("DEPLOY" if deploy else "SKIP_DIAGNOSTIC_ONLY"))
          PY

  deploy:
    needs: [release-scope]
    if: needs['release-scope'].outputs.deploy == 'true' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas antes del despliegue
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m compileall -q iachat
      - name: Comprobar configuración de conexión
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -eu
          test -n "$ORACLE_HOST" && test -n "$ORACLE_USER" && test -n "$ORACLE_SSH_KEY" || {
            echo "::error::Falta configurar acceso a Oracle en los secretos del entorno oracle-production."
            exit 1
          }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Same pinned public host key fingerprint as the successful login check.
          ssh-keyscan -T 10 -t ed25519 "$ORACLE_HOST" 2>/dev/null > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | head -1)"
          expected='SHA256:JCUGOZrLtlE+FkPv+evyeSAdxDs5iYqLk7hteTpOBHI'
          test "$actual" = "$expected" || { echo "::error::La huella SSH cambió. No se despliega."; exit 1; }
          chmod 600 ~/.ssh/known_hosts
      # Mandatory: deterministic unit tests, installation hash, service health, OIDC and private APIs.
      # Live free-provider inference is a separate check, not a deployment gate.
      - name: Transferir y desplegar con reversión
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='.github' --exclude='__pycache__' --exclude='.pytest_cache' -czf /tmp/iachat-release.tar.gz .
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          scp $SSH_OPTS /tmp/iachat-release.tar.gz "$ORACLE_USER@$ORACLE_HOST:/tmp/iachat-release-${GITHUB_RUN_ID}.tar.gz"
          ssh $SSH_OPTS "$ORACLE_USER@$ORACLE_HOST" "bash -s -- ${GITHUB_RUN_ID}" < scripts/deploy_oracle.sh
      - name: Limpiar clave temporal
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts /tmp/iachat-release.tar.gz
      - name: Publicar resultado y enlace de despliegue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -eu
          case "$JOB_STATUS" in success) state=success;; *) state=failure;; esac
          # Status is metadata only; no secrets, user messages or inference output.
          curl -fsS --max-time 12 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"state\":\"$state\",\"context\":\"iachat/oracle-e2e\",\"description\":\"Oracle CI and HTTP/auth checks: $JOB_STATUS (live inference unverified)\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" >/dev/null \
            || echo "::warning::Could not publish deployment status"
