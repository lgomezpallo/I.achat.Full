name: Desplegar IAchat en Oracle
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["IAchat CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: iachat-oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Evitar despliegues de IAchat por cambios administrativos de G.O.
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -Eq '^(iachat/|scripts/deploy_oracle[.]sh$|pyproject[.]toml$|requirements[^/]*[.]txt$|Dockerfile$|docker-compose[^/]*[.]ya?ml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios de runtime IAchat: no se despliega."
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas antes del despliegue
        if: steps.changes.outputs.deploy == 'true'
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m compileall -q iachat
      - name: Comprobar configuración de conexión
        if: steps.changes.outputs.deploy == 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -eu
          test -n "$ORACLE_HOST" && test -n "$ORACLE_USER" && test -n "$ORACLE_SSH_KEY" || {
            echo "::error::Falta configurar acceso a Oracle en los secretos del entorno oracle-production."
            exit 1
          }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Same pinned public host key fingerprint as the successful login check.
          ssh-keyscan -T 10 -t ed25519 "$ORACLE_HOST" 2>/dev/null > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          actual="$(ssh-keygen -lf ~/.ssh/known_hosts -E sha256 | awk '{print $2}' | head -1)"
          expected='SHA256:JCUGOZrLtlE+FkPv+evyeSAdxDs5iYqLk7hteTpOBHI'
          test "$actual" = "$expected" || { echo "::error::La huella SSH cambió. No se despliega."; exit 1; }
          chmod 600 ~/.ssh/known_hosts
      - name: Transferir y desplegar con reversión
        if: steps.changes.outputs.deploy == 'true'
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='.github' --exclude='__pycache__' --exclude='.pytest_cache' -czf /tmp/iachat-release.tar.gz .
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          scp $SSH_OPTS /tmp/iachat-release.tar.gz "$ORACLE_USER@$ORACLE_HOST:/tmp/iachat-release-${GITHUB_RUN_ID}.tar.gz"
          ssh $SSH_OPTS "$ORACLE_USER@$ORACLE_HOST" "bash -s -- ${GITHUB_RUN_ID}" < scripts/deploy_oracle.sh
      - name: Limpiar clave temporal
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts /tmp/iachat-release.tar.gz
