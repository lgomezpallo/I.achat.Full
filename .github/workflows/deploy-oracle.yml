name: Desplegar IAchat en Oracle
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iachat-oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas antes del despliegue
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
          python -m compileall -q iachat
      - name: Comprobar configuración de conexión
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$ORACLE_HOST" && test -n "$ORACLE_USER" && test -n "$ORACLE_SSH_KEY" && test -n "$ORACLE_KNOWN_HOSTS" || {
            echo "::error::Falta configurar acceso a Oracle en los secretos del entorno oracle-production."
            exit 1
          }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transferir y desplegar con reversión
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
        run: |
          set -euo pipefail
          tar --exclude='.git' --exclude='.github' --exclude='__pycache__' --exclude='.pytest_cache' -czf /tmp/iachat-release.tar.gz .
          SSH_OPTS="-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15"
          scp $SSH_OPTS /tmp/iachat-release.tar.gz "$ORACLE_USER@$ORACLE_HOST:/tmp/iachat-release-${GITHUB_RUN_ID}.tar.gz"
          ssh $SSH_OPTS "$ORACLE_USER@$ORACLE_HOST" "bash -s -- ${GITHUB_RUN_ID}" < scripts/deploy_oracle.sh
      - name: Limpiar clave temporal
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts /tmp/iachat-release.tar.gz
