name: Publicar estado de IAchat
on:
  workflow_run:
    workflows: ["IAchat CI", "Desplegar IAchat en Oracle"]
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            // Only report executions belonging to this repository.
            if (run.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo) return;
            const kind = run.name === 'IAchat CI' ? 'Pruebas (CI)' : 'Despliegue Oracle';
            const result = run.conclusion ?? 'sin resultado';
            const branch = run.head_branch ?? '?';
            const body = [
              '## Última ejecución registrada',
              '',
              '**Proceso:** ' + kind,
              '**Resultado:** ' + result,
              '**Rama:** ' + branch,
              '**Commit:** ' + run.head_sha,
              '**Fecha UTC:** ' + (run.updated_at || run.created_at),
              '**Ejecución:** ' + run.html_url,
              '',
              'Este registro se actualiza automáticamente. Una prueba verde no equivale a un despliegue verde.',
              'Para verificar instalación consultá la última ejecución de Desplegar IAchat en Oracle.'
            ].join('\n');
            const title = 'Estado automático de IAchat (CI y despliegue)';
            const {data: issues} = await github.rest.issues.listForRepo({
              ...context.repo, state:'open', per_page:100
            });
            const issue = issues.find(i => i.title === title && !i.pull_request);
            if (issue) {
              await github.rest.issues.update({...context.repo, issue_number:issue.number, body});
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }
