name: Inspeccionar Router en Oracle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspeccionar instalacion sin modificarla
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: bash scripts/inspeccionar_router_oracle.sh
