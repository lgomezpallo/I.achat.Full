name: Estado de Oracle
on:
  workflow_dispatch:
  # Scheduled runs use the default branch, authorized for protected read-only diagnostics.
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/oracle-status.yml
      - scripts/diagnostico_oracle.sh
permissions:
  contents: read
jobs:
  candidata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # This job never receives Oracle credentials or the protected environment.
    permissions:
      contents: read
    steps:
      - name: Checkout candidate sources (data only)
        uses: actions/checkout@v4
        with:
          ref: automation/web-source-host-diversity-20261028
          persist-credentials: false
      - name: SHA-256 of candidate files (no execution)
        shell: bash
        run: |
          set -euo pipefail
          for file in iachat/app.py iachat/backend.py iachat/web.py scripts/deploy_oracle.sh; do
            test -f "$file"
            printf 'candidate_hash_%s: ' "$file"
            sha256sum "$file" | cut -d ' ' -f1
          done
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar estado remoto
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: bash scripts/diagnostico_oracle.sh
