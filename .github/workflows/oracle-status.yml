name: Estado de Oracle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/oracle-status.yml
permissions:
  contents: read
jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar estado remoto
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: bash scripts/diagnostico_oracle.sh
