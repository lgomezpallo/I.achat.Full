name: Estado de Oracle
on:
  workflow_dispatch:
  # Check IAchat and attempt service restart only when the health endpoint is unavailable.
  schedule:
    - cron: '17 */4 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/oracle-status.yml
      - scripts/diagnostico_oracle.sh
permissions:
  contents: read
  statuses: write
jobs:
  estado:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: oracle-production
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar estado remoto
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: bash scripts/diagnostico_oracle.sh
      - name: Publicar salud de Oracle
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -eu
          case "$JOB_STATUS" in success) state=success;; *) state=failure;; esac
          curl -fsS --max-time 12 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"state\":\"$state\",\"context\":\"iachat/oracle-health\",\"description\":\"Oracle IAchat health and recovery: $JOB_STATUS\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null \
            || echo "::warning::Could not publish Oracle health status"
