name: IAchat CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Ejecutar pruebas y guardar diagnóstico
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-result.txt
      - name: Conservar diagnóstico cuando fallan las pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iachat-pytest-diagnostico
          path: pytest-result.txt
          retention-days: 3
      - run: docker build -t iachat-ci .
