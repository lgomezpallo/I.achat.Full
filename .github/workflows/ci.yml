name: IAchat CI
on:
  push:
    branches: [main, desarrollo/iachat-full, feat/go-ute-second-instance-guard-20261030]
  pull_request:
permissions:
  contents: read
  statuses: write
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Ejecutar pruebas y guardar diagnóstico
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-result.txt
      - name: Medir recuperación de memoria en conversación larga simulada
        run: python scripts/smoke_memory_recall.py
      - name: Validar sintaxis del E2E de producción
        run: python -m py_compile scripts/iachat_production_e2e.py
      - name: Conversación aislada sin credenciales reales
        run: python scripts/smoke_conversation.py
      - run: docker build -t iachat-ci .
  public_web_smoke:
    # Real public endpoints only: no provider accounts, API keys or inference.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Comprobar RSS multidominio y lectura HTTPS real
        run: python scripts/smoke_web_public.py

  report:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, public_web_smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Publicar enlace de CI de main
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.tests.result }}
          WEB_RESULT: ${{ needs.public_web_smoke.result }}
        run: |
          set -eu
          if [ "$TEST_RESULT" = success ] && [ "$WEB_RESULT" = success ]; then state=success; else state=failure; fi
          curl -fsS --max-time 12 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"state\":\"$state\",\"context\":\"iachat/ci-main\",\"description\":\"CI tests=$TEST_RESULT web=$WEB_RESULT\",\"target_url\":\"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null || echo "::warning::Could not publish CI status"
