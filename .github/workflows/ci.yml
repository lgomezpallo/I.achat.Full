name: IAchat CI
on:
  push:
    branches: [main, desarrollo/iachat-full]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Ejecutar pruebas y guardar diagnóstico
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-result.txt
      - name: Conversación aislada sin credenciales reales
        run: python scripts/smoke_conversation.py
      - run: docker build -t iachat-ci .
  public_web_smoke:
    # Real public endpoints only: no provider accounts, API keys or inference.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Comprobar RSS multidominio y lectura HTTPS real
        run: python scripts/smoke_web_public.py

  oracle_diagnostic_dispatch:
    # This job never receives SSH credentials. It only requests the existing
    # protected, read-only workflow on the candidate branch, once CI passes.
    # The production environment's approvals/restrictions remain authoritative.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 31 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'automation/web-source-host-diversity-20261028'
    needs: [tests, public_web_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
    steps:
      - name: Solicitar diagnóstico P0 protegido (solo lectura)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIAG_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          gh workflow run oracle-status.yml --ref "$DIAG_BRANCH"
          echo "Diagnostic requested; the protected workflow result must be checked separately."
