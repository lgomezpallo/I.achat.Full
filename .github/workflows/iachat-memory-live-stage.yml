name: IAchat Oracle credential-scope diagnostic (branch only)
on:
  push:
    branches:
      - "test/isolated-live-memory-stage-*"

permissions:
  contents: read

jobs:
  diagnose-credential-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check whether repository-scoped SSH credentials are available (no values)
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$ORACLE_HOST" && -n "$ORACLE_USER" && -n "$ORACLE_SSH_KEY" ]]; then
            echo "REPOSITORY_SCOPED_ORACLE_SSH=AVAILABLE"
          else
            echo "REPOSITORY_SCOPED_ORACLE_SSH=UNAVAILABLE"
            echo "No SSH attempt made. Existing oracle-production environment is required or credentials are absent."
          fi
